name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go vet .
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go test -v -count=1 .
      - run: go build -o json-doctor .
